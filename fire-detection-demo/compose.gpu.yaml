services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
    image: fire-detection-backend:gpu
    environment:
      DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
